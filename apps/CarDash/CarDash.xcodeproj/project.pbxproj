<!--
	Hand-written Xcode project.

	This file is authored as an XML property list rather than Xcode's usual OpenStep
	format. xcodebuild and Xcode parse both, and XML is far safer to write by hand: no
	brace balancing, no quoting rules, no comment conventions to get subtly wrong. Xcode
	will rewrite this into OpenStep format the first time the project is opened and
	saved — that is expected. Commit that diff and carry on; after it happens, OpenStep
	is canonical.

	It stays small because of two decisions:

	  1. `App` and `AppTests` are PBXFileSystemSynchronizedRootGroup entries ("buildable
	     folders", Xcode 16+). They reference a *directory*. Every file inside is
	     discovered and compiled automatically, so adding a Swift file NEVER requires
	     touching this file — there are no PBXFileReference or PBXBuildFile objects to
	     maintain per source file.

	  2. Almost all code lives in the two local Swift packages under Packages/, reached
	     through a single XCLocalSwiftPackageReference each. Dependencies are declared in
	     those packages' Package.swift, not here.

	  3. Build settings live in Supporting/Base.xcconfig. Settings written here would
	     override the xcconfig, so the buildSettings dictionaries below hold only what
	     genuinely differs per target or per configuration.

	Object identifiers are sequential and human-assigned (CD…0001 upward) rather than the
	random 96-bit values Xcode generates. Xcode does not care, and it makes this file
	reviewable.
-->
