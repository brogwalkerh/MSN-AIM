name: CI

on:
  push:
    branches: ['**']
    # apps/ holds an unrelated iOS project with its own workflow (ios.yml). Nothing
    # under it is visible to pnpm, so running the Node jobs for those commits only
    # burns minutes.
    paths-ignore: ['apps/**']
  pull_request:
    paths-ignore: ['apps/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: pnpm install --frozen-lockfile
      - name: Start Open OSCAR Server
        run: |
          nohup ./scripts/run-oscar-server.sh > oscar-server.log 2>&1 &
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/5190) 2>/dev/null && break; sleep 2; done
          (echo > /dev/tcp/127.0.0.1/5190)
      - run: pnpm test:integration
      - name: Server log on failure
        if: failure()
        run: cat oscar-server.log

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: pnpm install --frozen-lockfile
      - name: Start Open OSCAR Server
        run: |
          nohup ./scripts/run-oscar-server.sh > oscar-server.log 2>&1 &
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/5190) 2>/dev/null && break; sleep 2; done
      - run: pnpm build
      - run: xvfb-run -a pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: tests/e2e/artifacts/
          if-no-files-found: ignore
